<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NVALAS Board Action Tracker</title>
<style>
:root{--navy:#062d49;--teal:#176b75;--gold:#e1ad35;--cream:#fff8e7;--ink:#173248;--muted:#667b89;--line:#d7e4ea;--danger:#bf4d38;--done:#2f7d61}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#eef7fb,#fffaf0);color:var(--ink)}
.wrap{max-width:1500px;margin:0 auto;padding:26px}
.hero{background:linear-gradient(120deg,var(--navy),#0e5f91 58%,#147e76);color:#fff;border-radius:24px;padding:28px 30px;box-shadow:0 12px 30px rgba(6,45,73,.13)}
.hero small{text-transform:uppercase;letter-spacing:.14em;color:#ffe69c;font-weight:800}
.hero h1{margin:8px 0 4px;font-size:34px}
.hero p{margin:0;color:#dceff3}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(90deg,var(--navy),#0e5f91);color:#fff}
.secondary{background:#eef5f7;color:var(--navy);border:1px solid #cadce4}
.danger{background:var(--danger);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 22px rgba(6,45,73,.07);overflow:hidden}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1150px}
thead th{background:#176b75;color:#fff;padding:15px 13px;text-align:left;font-size:14px}
td{padding:13px;border-bottom:1px solid var(--line);vertical-align:top}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #c8d8df;border-radius:10px;background:#fff}
textarea{min-height:54px;resize:vertical}
.status{font-weight:700}
.note{color:var(--muted);font-size:13px;margin:14px 2px 0}
.add-form{display:none;margin:0 0 18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 7px 22px rgba(6,45,73,.07)}
.add-form.open{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr;gap:10px;align-items:end}
.add-form label{font-size:12px;font-weight:800;color:var(--navy)}
.add-form .wide{display:flex;gap:8px}
.completed select{background:#e5f4ec;color:var(--done);font-weight:800}
.inprogress select{background:#fff1c9;color:#7a5a00;font-weight:800}
@media(max-width:900px){.add-form.open{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <small>Executive Leadership Hub</small>
    <h1>NVALAS Board Action Tracker</h1>
    <p>Live working tracker • Updated from the exported Hub backup</p>
  </section>

  <div class="toolbar">
    <button class="primary" onclick="toggleAdd()">+ Add Action Item</button>
    <button class="secondary" onclick="exportCSV()">Export CSV</button>
    <button class="secondary" onclick="resetToSource()">Reset to Exported Source</button>
  </div>

  <section id="addForm" class="add-form">
    <div><label>Action Item</label><input id="newAction"></div>
    <div><label>Owner</label><input id="newOwner"></div>
    <div><label>Status</label><select id="newStatus"><option>In Progress</option><option>Not Started</option><option>Pending</option><option>Completed</option><option>Deferred</option></select></div>
    <div><label>Target Date</label><input id="newDate" type="date"></div>
    <div><label>Notes</label><div class="wide"><input id="newNotes"><button class="primary" onclick="addItem()">Add</button></div></div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:29%">Action Item</th>
            <th style="width:15%">Owner</th>
            <th style="width:14%">Status</th>
            <th style="width:14%">Target Date</th>
            <th style="width:20%">Notes</th>
            <th style="width:8%">Remove</th>
          </tr>
        </thead>
        <tbody id="trackerBody"></tbody>
      </table>
    </div>
  </section>
  <p class="note">Changes save automatically in this browser. Use Export CSV for a backup before clearing browser data or moving to another device.</p>
</div>

<script>
const SOURCE = [{"Action Item": "Vote on by-laws", "Owner": "Executive Board", "Status": "In Progress", "Target Date": "2026-08-26", "Notes": ""}, {"Action Item": "Publish membership renewal communication", "Owner": "Communications", "Status": "In Progress", "Target Date": "2026-08-26", "Notes": ""}, {"Action Item": "Confirm officer workspace documents", "Owner": "Executive Board", "Status": "In Progress", "Target Date": "2026-08-26", "Notes": ""}, {"Action Item": "Test one-click board access", "Owner": "CIO/CFO", "Status": "In Progress", "Target Date": "2026-08-26", "Notes": ""}, {"Action Item": "Strategic Plan", "Owner": "Executive Director/VP", "Status": "In Progress", "Target Date": "", "Notes": ""}, {"Action Item": "Add ALAS logo on NVALAS website (a proud affiliate of ALAS)", "Owner": "Communications", "Status": "In Progress", "Target Date": "2026-08-26", "Notes": ""}, {"Action Item": "Work on organizing a \"Noche Bohemia\" with mariachi teachers for the upcoming fall social event.", "Owner": "CIO", "Status": "In Progress", "Target Date": "", "Notes": ""}, {"Action Item": "Follow up on membership renewals with members who have not yet paid (Johnny and Isabelita Sanchez).", "Owner": "CCO", "Status": "In Progress", "Target Date": "", "Notes": ""}, {"Action Item": "Continue developing the Spring Awards event plan, including securing a venue and potential sponsors.", "Owner": "CCO", "Status": "In Progress", "Target Date": "", "Notes": ""}, {"Action Item": "Finalize the dates for the upcoming La Semilla Institute session (targeting November/December) and create a flyer for approval.", "Owner": "COO", "Status": "In Progress", "Target Date": "", "Notes": ""}, {"Action Item": "Send the link to the embroidery shop options for swag to the team for feedback.", "Owner": "Executive Director", "Status": "In Progress", "Target Date": "", "Notes": ""}, {"Action Item": "Reconcile July Banking and update Executive Leadership Hub", "Owner": "CFO", "Status": "Completed", "Target Date": "2026-08-05", "Notes": ""}];
const KEY = "nvalas-board-action-tracker-live-v2";
let items = load();

function normalize(row) {
  return {
    action: row["Action Item"] ?? row.action ?? "",
    owner: row["Owner"] ?? row.owner ?? "",
    status: row["Status"] ?? row.status ?? "In Progress",
    date: row["Target Date"] ?? row.date ?? "",
    notes: row["Notes"] ?? row.notes ?? ""
  };
}

function load() {
  const saved = localStorage.getItem(KEY);
  if (saved) {
    try { return JSON.parse(saved); } catch(e) {}
  }
  return SOURCE.map(normalize);
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(items));
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
}

function rowClass(status) {
  if (status === "Completed") return "completed";
  if (status === "In Progress") return "inprogress";
  return "";
}

function render() {
  const body = document.getElementById("trackerBody");
  body.innerHTML = items.map((x,i) => `
    <tr class="${rowClass(x.status)}">
      <td><textarea onchange="update(${i},'action',this.value)">${esc(x.action)}</textarea></td>
      <td><input value="${esc(x.owner)}" onchange="update(${i},'owner',this.value)"></td>
      <td><select class="status" onchange="update(${i},'status',this.value)">
        ${["Not Started","In Progress","Pending","Completed","Deferred"].map(s => `<option ${s===x.status?'selected':''}>${s}</option>`).join("")}
      </select></td>
      <td><input type="date" value="${esc(x.date)}" onchange="update(${i},'date',this.value)"></td>
      <td><textarea onchange="update(${i},'notes',this.value)">${esc(x.notes)}</textarea></td>
      <td><button class="danger" onclick="removeItem(${i})">Delete</button></td>
    </tr>`).join("");
}

function update(i, field, value) {
  items[i][field] = value;
  save();
  render();
}

function removeItem(i) {
  if (!confirm("Delete this action item?")) return;
  items.splice(i,1);
  save();
  render();
}

function toggleAdd() {
  document.getElementById("addForm").classList.toggle("open");
}

function addItem() {
  const action = document.getElementById("newAction").value.trim();
  if (!action) { alert("Please enter an action item."); return; }
  items.push({
    action,
    owner: document.getElementById("newOwner").value.trim(),
    status: document.getElementById("newStatus").value,
    date: document.getElementById("newDate").value,
    notes: document.getElementById("newNotes").value.trim()
  });
  save();
  ["newAction","newOwner","newDate","newNotes"].forEach(id => document.getElementById(id).value="");
  document.getElementById("newStatus").value="In Progress";
  render();
}

function exportCSV() {
  const rows = [["Action Item","Owner","Status","Target Date","Notes"], ...items.map(x => [x.action,x.owner,x.status,x.date,x.notes])];
  const csv = rows.map(r => r.map(v => `\"${String(v??"").replace(/\"/g,'\"\"')}\"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "NVALAS-Board-Action-Tracker.csv";
  a.click();
  URL.revokeObjectURL(url);
}

function resetToSource() {
  if (!confirm("Reset all browser edits to the exported source tracker?")) return;
  items = SOURCE.map(normalize);
  save();
  render();
}

render();
</script>
</body>
</html>
